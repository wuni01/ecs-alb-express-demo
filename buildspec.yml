version: 0.2

env:
  shell: bash
  variables:
    CONTAINER_NAME: "web"

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail

        : "${REPOSITORY_URI:?REPOSITORY_URI is required}"
        : "${CODEBUILD_BUILD_NUMBER:?Build number is required}"

        REGISTRY="${REPOSITORY_URI%/*}"

        echo "Logging in to Amazon ECR"
        echo "ECR Registry: ${REGISTRY}"

        docker info > /dev/null

        aws ecr get-login-password \
          --region "$AWS_DEFAULT_REGION" \
          | docker login \
              --username AWS \
              --password-stdin "$REGISTRY"

  build:
    commands:
      - |
        set -euo pipefail

        IMAGE_TAG="build-${CODEBUILD_BUILD_NUMBER}"

        echo "Building image: ${IMAGE_TAG}"

        docker build \
          -t "${REPOSITORY_URI}:${IMAGE_TAG}" .

  post_build:
    commands:
      - |
        set -euo pipefail

        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "Previous build phase failed"
          exit 1
        fi

        IMAGE_TAG="build-${CODEBUILD_BUILD_NUMBER}"

        echo "Pushing image to ECR"

        docker push "${REPOSITORY_URI}:${IMAGE_TAG}"

        printf '[{"name":"%s","imageUri":"%s"}]' \
          "$CONTAINER_NAME" \
          "${REPOSITORY_URI}:${IMAGE_TAG}" \
          > imagedefinitions.json

        echo "Image definitions:"
        cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
